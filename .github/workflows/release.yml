name: Build Release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pywin32

      - name: Compile with PyInstaller
        run: >
          pyinstaller --onefile --windowed --uac-admin 
          --icon=assets/app.ico 
          --add-data="assets;assets" 
          --name=SteamMussarelos 
          main.py

      - name: Create Free Digital Certificate and Sign EXE
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=SteamMussarelos" -FriendlyName "SteamMussarelos Open Source" -CertStoreLocation "Cert:\CurrentUser\My"
          $password = ConvertTo-SecureString "MussarelosSecurePass123!" -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath "dist\cert.pfx" -Password $password
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
          
          $timestampServers = @(
              "http://sectigo.com",
              "http://digicert.com",
              "http://globalsign.com",
              "http://apple.com"
          )
          
          $signed = $false
          foreach ($server in $timestampServers) {
              Write-Host "Tentando assinar com o servidor: $server..."
              & $signtool sign /f "dist\cert.pfx" /p "MussarelosSecurePass123!" /fd SHA256 /tr $server /td SHA256 dist/SteamMussarelos.exe 2>$null
              
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Sucesso!"
                  $signed = $true
                  break
              } else {
                  Write-Warning "Falha ao alcançar $server. Tentando próximo..."
                  Start-Sleep -Seconds 5
              }
          }
          
          Remove-Item "dist\cert.pfx"
          
          if (-not $signed) {
              Write-Error "Erro Crítico: Todos os servidores falharam."
              exit 1
          }


      - name: Verify Executable Location
        run: Get-ChildItem -Path dist -Filter *.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/SteamMussarelos.exe
