name: Build Release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pywin32

      - name: Compile with PyInstaller
        run: >
          pyinstaller --onefile --windowed --uac-admin 
          --icon=assets/app.ico 
          --add-data="assets;assets" 
          --name=SteamMussarelos 
          main.py

      - name: Sign Executable
        uses: skymatic/code-signing-action@v1
        with:
          certificate: 'self-signed'
          files: 'dist/SteamMussarelos.exe'

      - name: Verify Executable Location
        run: Get-ChildItem -Path dist -Filter *.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/SteamMussarelos.exe
